<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PalmStreet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0d12;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  /* même règle appliquée explicitement à tout, pour couvrir les boutons,
     champs et textes du menu — évite le menu "copier/coller" au tap sur mobile */
  * {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  /* exception : le champ pseudo doit rester sélectionnable/éditable normalement */
  #pseudoField {
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  #wrap {
    position: relative;
    width: 100%;
    max-width: 460px;
    padding: 0 8px;
    box-sizing: border-box;
  }
  canvas {
    background: #1a1a2e;
    display: block;
    width: 100%;
    height: auto;
    max-height: 100dvh;
    border: 4px solid #ff7a1a;
    box-shadow: 0 0 30px rgba(255, 122, 26, 0.4);
    image-rendering: pixelated;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 24px;
    color: #ff7a1a;
    font-size: clamp(12px, 3.6vw, 18px);
    font-weight: bold;
    text-shadow: 0 0 6px rgba(255,122,26,0.6);
    letter-spacing: 1px;
    user-select: none;
  }
  #best {
    position: absolute;
    top: 12px;
    right: 24px;
    color: #7fffd4;
    font-size: clamp(10px, 2.8vw, 14px);
    text-shadow: 0 0 6px rgba(127,255,212,0.6);
    user-select: none;
  }
  #combo {
    position: absolute;
    top: 36px;
    left: 24px;
    color: #ffd400;
    font-size: clamp(10px, 2.6vw, 13px);
    font-weight: bold;
    text-shadow: 0 0 6px rgba(255,212,0,0.6);
    user-select: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  #combo.show { opacity: 1; }
  #milestoneBanner {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translate(-50%, -14px) scale(0.85);
    color: #ff7a1a;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: clamp(26px, 9vw, 44px);
    letter-spacing: 3px;
    text-shadow: 0 0 12px rgba(255,122,26,0.9), 0 0 28px rgba(255,122,26,0.6);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    text-align: center;
    z-index: 50;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  #milestoneBanner.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
  #controlsHint {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.55);
    font-size: clamp(9px, 2.4vw, 11px);
    letter-spacing: 1px;
    user-select: none;
    pointer-events: none;
    text-shadow: 0 0 4px rgba(0,0,0,0.6);
  }
  #btnMute {
    position: absolute;
    bottom: 6px;
    right: 10px;
    z-index: 20;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid rgba(127,255,212,0.6);
    background: rgba(13,13,18,0.55);
    color: #7fffd4;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    text-align: center;
    background: rgba(13,13,18,0.55);
    user-select: none;
    padding: 0 16px;
    box-sizing: border-box;
  }
  #overlay h1 {
    color: #ff7a1a;
    font-size: clamp(30px, 11vw, 48px);
    margin: 0 0 4px 0;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255,122,26,0.9), 0 0 26px rgba(255,122,26,0.5);
    font-family: 'Courier New', monospace;
  }
  #overlay h1 span {
    color: #7fffd4;
    text-shadow: 0 0 12px rgba(127,255,212,0.9), 0 0 26px rgba(127,255,212,0.5);
  }
  #overlay .tagline {
    color: #ffd400;
    font-size: clamp(10px, 3vw, 12px);
    letter-spacing: 3px;
    margin: 0 0 14px 0;
    text-transform: uppercase;
  }
  #overlay p {
    margin: 4px 0;
    font-size: clamp(11px, 3.2vw, 13px);
    color: #cfd8ff;
  }
  #overlay .credit {
    margin-top: 14px;
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(127,255,212,0.45);
    text-shadow: 0 0 6px rgba(127,255,212,0.3);
  }
  #overlay .go {
    color: #ff5566;
    font-size: clamp(18px, 5.5vw, 22px);
    margin-bottom: 8px;
    text-shadow: 0 0 10px rgba(255,85,102,0.8);
  }
  .hidden { display: none !important; }

  /* ---- Menu (boutons START / TOP 10) ---- */
  .menuButtons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    margin: 10px 0 6px 0;
  }
  .menuButtons button {
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: clamp(13px, 4vw, 16px);
    letter-spacing: 2px;
    padding: 10px 30px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #btnStart {
    background: #ff7a1a;
    color: #0d0d12;
    box-shadow: 0 0 14px rgba(255,122,26,0.6);
  }
  #btnScores {
    background: transparent;
    color: #7fffd4;
    border: 2px solid #7fffd4;
    box-shadow: 0 0 10px rgba(127,255,212,0.35);
  }

  /* ---- Choix du personnage ---- */
  .characterSelect {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 4px 0 12px 0;
  }
  .charCard {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    border: 2px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .charCard.selected {
    border-color: #ff7a1a;
    box-shadow: 0 0 12px rgba(255,122,26,0.55);
  }
  .charCard img {
    width: 34px;
    height: 58px;
    image-rendering: pixelated;
    -webkit-user-drag: none;
  }
  .charCard .charName {
    font-size: 10px;
    letter-spacing: 1px;
    font-weight: bold;
    color: #cfd8ff;
  }
  .charCard.selected .charName { color: #ff7a1a; }

  /* ---- Enregistrement du score en fin de partie ---- */
  #scoreSaveArea {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }
  #pseudoField {
    font-family: 'Courier New', monospace;
    text-align: center;
    padding: 8px 10px;
    border-radius: 4px;
    border: none;
    font-size: 13px;
    width: 170px;
    max-width: 65vw;
  }
  #btnSaveScore {
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 8px 18px;
    border: none;
    border-radius: 6px;
    background: #ffd400;
    color: #1a1a1a;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #scoreSaveStatus {
    font-size: 11px;
    color: #7fffd4;
    min-height: 14px;
  }
  .secondaryBtn {
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 7px 16px;
    margin-top: 4px;
    border: 2px solid #7fffd4;
    border-radius: 6px;
    background: transparent;
    color: #7fffd4;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---- Fenêtre classement TOP 10 ---- */
  #leaderboardModal {
    position: fixed;
    inset: 0;
    z-index: 10050;
    background: rgba(8,8,12,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
  }
  #leaderboardModal .lbBox {
    background: #17172a;
    border: 2px solid #ff7a1a;
    box-shadow: 0 0 24px rgba(255,122,26,0.5);
    border-radius: 10px;
    padding: 18px 22px;
    width: 260px;
    max-width: 82vw;
    max-height: 80vh;
    overflow-y: auto;
    text-align: center;
  }
  #leaderboardModal h2 {
    color: #ff7a1a;
    font-size: 20px;
    letter-spacing: 3px;
    margin: 0 0 12px 0;
    text-shadow: 0 0 10px rgba(255,122,26,0.8);
  }
  .lbMsg { color: #cfd8ff; font-size: 12px; }
  .lbList { list-style: none; margin: 0; padding: 0; }
  .lbList li {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 4px;
    font-size: 13px;
    color: #fff;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .lbList li .lbRank { color: #ffd400; font-weight: bold; width: 22px; text-align: left; }
  .lbList li .lbName { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lbList li .lbScore { color: #7fffd4; font-weight: bold; }
  #btnCloseLb {
    margin-top: 14px;
    font-family: inherit;
    font-weight: bold;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    background: #ff7a1a;
    color: #0d0d12;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

</style>
</head>
<body>
<div id="wrap">

  <div id="hud">SCORE 0</div>
  <div id="best">BEST 0</div>
  <div id="combo">COMBO x1</div>
  <div id="milestoneBanner"></div>
  <div id="controlsHint">TAP = OLLIE · DOUBLE TAP = FIGURE</div>
  <button id="btnMute" type="button">🔊</button>
  <canvas id="game" width="390" height="620"></canvas>
  <div id="overlay">
    <h1>Palm<span>Street</span></h1>
    <p class="tagline">SKATE RUN</p>
    <div class="characterSelect">
      <div class="charCard selected" id="charCardFreestyle" data-char="freestyle">
        <img id="charPreviewImgFreestyle" alt="Freestyle">
        <span class="charName">FREESTYLE</span>
      </div>
      <div class="charCard" id="charCardKeketsk8" data-char="keketsk8">
        <img id="charPreviewImgKeketsk8" alt="Keketsk8">
        <span class="charName">KEKETSK8</span>
      </div>
      <div class="charCard" id="charCardGuigui" data-char="guigui">
        <img id="charPreviewImgGuigui" alt="Guigui">
        <span class="charName">GUIGUI</span>
      </div>
    </div>
    <div class="menuButtons">
      <button id="btnStart" type="button">START</button>
      <button id="btnScores" type="button">TOP 10</button>
    </div>
    <p style="margin-top:12px;">Espace / Clic / Tap = Ollie</p>
    <p>Atterris sur un rail = Grind automatique</p>
    <p class="credit">créé par Charles J</p>
  </div>
  <div id="leaderboardModal" class="hidden">
    <div class="lbBox">
      <h2>TOP 10</h2>
      <div id="lbContent"><p class="lbMsg">Chargement...</p></div>
      <button id="btnCloseLb" type="button">Fermer</button>
    </div>
  </div>
</div>

<script>
(function() {
  // ---- Réglages tactiles mobiles : le format vertical est nativement adapté
  // au téléphone, plus besoin de forcer une rotation ou une taille en JS.
  // Tout est protégé par un try/catch : certains navigateurs intégrés
  // (Instagram, TikTok...) bloquent ou ne supportent pas certaines API ;
  // sans cette protection, une erreur ici arrêterait TOUT le script.
  try {
    // blocage renforcé du défilement/zoom tactile : certains navigateurs
    // intégrés ignorent le CSS touch-action, donc on bloque aussi en JS
    document.addEventListener('touchmove', (e) => {
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', (e) => {
      if (e.cancelable) e.preventDefault();
    });

    // empêche la sélection de texte / le menu copier-coller au tap ou
    // appui long, sauf sur le champ pseudo (qui doit rester éditable)
    document.addEventListener('selectstart', (e) => {
      if (e.target && e.target.id === 'pseudoField') return;
      e.preventDefault();
    });
    document.addEventListener('contextmenu', (e) => {
      if (e.target && e.target.id === 'pseudoField') return;
      e.preventDefault();
    });
  } catch (e) {
    // en cas d'echec, le jeu continue simplement sans ces protections
  }

  // ---- Moteur audio : tout est synthétisé en JS (Web Audio API), aucun
  // fichier son à charger. Musique de fond en boucle + bruitages courts.
  const Audio2 = (function () {
    let ctx = null;
    let musicGain = null, sfxGain = null;
    let muted = false;
    try {
      muted = localStorage.getItem('skate_muted') === '1';
    } catch (e) {}

    let noiseBuffer = null;
    let musicTimer = null;
    let nextNoteTime = 0;
    let step = 0;
    let grindOsc = null, grindGain = null, grindLfo = null;

    const MELODY = [261.63, 329.63, 392.00, 329.63, 440.00, 392.00, 329.63, 293.66];
    const BASS =   [130.81, null,   196.00, null,   220.00, null,   164.81, null];
    const STEP_DUR = 60 / 132 / 2; // double croches à 132 bpm

    function ensureCtx() {
      if (ctx) return ctx;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        musicGain = ctx.createGain(); musicGain.gain.value = 0.16;
        musicGain.connect(ctx.destination);
        sfxGain = ctx.createGain(); sfxGain.gain.value = 0.4;
        sfxGain.connect(ctx.destination);
        const bufferSize = ctx.sampleRate * 0.3;
        noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      } catch (e) {
        ctx = null;
      }
      return ctx;
    }

    function resume() {
      const c = ensureCtx();
      if (c && c.state === 'suspended') c.resume().catch(() => {});
    }

    function tone(freq, duration, type, gainNode, startTime, volume) {
      if (!ctx || muted) return;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, startTime);
      g.gain.setValueAtTime(0, startTime);
      g.gain.linearRampToValueAtTime(volume, startTime + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(g); g.connect(gainNode);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.02);
    }

    function scheduleMusic() {
      if (!ctx) return;
      while (nextNoteTime < ctx.currentTime + 0.12) {
        const i = step % MELODY.length;
        tone(MELODY[i], STEP_DUR * 0.85, 'square', musicGain, nextNoteTime, 0.10);
        if (BASS[i]) tone(BASS[i], STEP_DUR * 1.8, 'triangle', musicGain, nextNoteTime, 0.11);
        nextNoteTime += STEP_DUR;
        step++;
      }
    }

    function startMusic() {
      if (!ensureCtx()) return;
      resume();
      if (musicTimer) return;
      nextNoteTime = ctx.currentTime + 0.05;
      step = 0;
      scheduleMusic();
      musicTimer = setInterval(scheduleMusic, 50);
    }

    function stopMusic() {
      if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    }

    function jumpSfx() {
      if (!ensureCtx() || muted) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(260, t);
      osc.frequency.exponentialRampToValueAtTime(620, t + 0.11);
      g.gain.setValueAtTime(0.28, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
      osc.connect(g); g.connect(sfxGain);
      osc.start(t); osc.stop(t + 0.15);
    }

    function coinSfx() {
      if (!ensureCtx() || muted) return;
      const t = ctx.currentTime;
      tone(880, 0.07, 'square', sfxGain, t, 0.3);
      tone(1320, 0.09, 'square', sfxGain, t + 0.06, 0.3);
    }

    function crashSfx() {
      if (!ensureCtx() || muted) return;
      const t = ctx.currentTime;
      // choc bas qui degringole
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.35);
      g.gain.setValueAtTime(0.35, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.connect(g); g.connect(sfxGain);
      osc.start(t); osc.stop(t + 0.42);
      // bruit d'impact
      if (noiseBuffer) {
        const src = ctx.createBufferSource();
        src.buffer = noiseBuffer;
        const filt = ctx.createBiquadFilter();
        filt.type = 'lowpass'; filt.frequency.value = 900;
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.3, t);
        ng.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        src.connect(filt); filt.connect(ng); ng.connect(sfxGain);
        src.start(t); src.stop(t + 0.26);
      }
    }

    function startGrindSfx() {
      if (!ensureCtx() || muted || grindOsc) return;
      const t = ctx.currentTime;
      grindOsc = ctx.createOscillator();
      grindGain = ctx.createGain();
      grindOsc.type = 'sawtooth';
      grindOsc.frequency.setValueAtTime(140, t);
      grindLfo = ctx.createOscillator();
      grindLfo.type = 'sine'; grindLfo.frequency.value = 14;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = 18;
      grindLfo.connect(lfoGain); lfoGain.connect(grindOsc.frequency);
      grindGain.gain.setValueAtTime(0, t);
      grindGain.gain.linearRampToValueAtTime(0.14, t + 0.05);
      grindOsc.connect(grindGain); grindGain.connect(sfxGain);
      grindOsc.start(t); grindLfo.start(t);
    }

    function stopGrindSfx() {
      if (!grindOsc || !ctx) return;
      const t = ctx.currentTime;
      grindGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      grindOsc.stop(t + 0.1);
      grindLfo.stop(t + 0.1);
      grindOsc = null; grindGain = null; grindLfo = null;
    }

    function trickSfx() {
      if (!ensureCtx() || muted) return;
      const t = ctx.currentTime;
      tone(500, 0.05, 'square', sfxGain, t, 0.22);
      tone(750, 0.05, 'square', sfxGain, t + 0.04, 0.22);
      tone(1000, 0.08, 'square', sfxGain, t + 0.08, 0.24);
    }

    function setMuted(v) {
      muted = v;
      try { localStorage.setItem('skate_muted', v ? '1' : '0'); } catch (e) {}
      if (v) stopGrindSfx();
    }
    function isMuted() { return muted; }

    return { resume, startMusic, stopMusic, jumpSfx, coinSfx, crashSfx, startGrindSfx, stopGrindSfx, trickSfx, setMuted, isMuted };
  })();

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const comboEl = document.getElementById('combo');
  const milestoneBanner = document.getElementById('milestoneBanner');

  function showMilestoneBanner(text, duration) {
    milestoneBanner.textContent = text;
    milestoneBanner.classList.add('show');
    clearTimeout(milestoneBanner._hideTimer);
    milestoneBanner._hideTimer = setTimeout(() => {
      milestoneBanner.classList.remove('show');
    }, duration || 2600);
  }

  // ---- Journal de visite (qui ouvre le jeu, avec quel navigateur/appareil,
  // à quelle heure) : Netlify Function + Netlify Blobs, voir netlify/functions/visits.js
  // Consultable sur /api/visits?key=TON_MOT_DE_PASSE (voir VISITS_KEY)
  (function logVisit() {
    try {
      if (sessionStorage.getItem('palmstreet_visit_logged') === '1') return;
      fetch('/api/visits', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          screen: window.screen ? (window.screen.width + 'x' + window.screen.height) : 'inconnu',
          lang: navigator.language || 'inconnue'
        })
      }).catch(() => {});
      sessionStorage.setItem('palmstreet_visit_logged', '1');
    } catch (e) { /* si sessionStorage est bloqué, on ignore simplement */ }
  })();

  // ---- Classement en ligne (TOP 10 partagé entre tous les joueurs) ----
  // Backend : Netlify Function + Netlify Blobs (voir netlify/functions/scores.js)
  const SCORES_API = '/api/scores';

  async function fetchLeaderboard() {
    try {
      const res = await fetch(SCORES_API, { cache: 'no-store' });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) {
      return null;
    }
  }

  async function submitScore(name, scoreValue) {
    try {
      const res = await fetch(SCORES_API, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name, score: scoreValue })
      });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) {
      return null;
    }
  }

  function renderLeaderboardList(list) {
    const content = document.getElementById('lbContent');
    if (!list) {
      content.innerHTML = '<p class="lbMsg">Classement indisponible pour le moment.</p>';
      return;
    }
    if (list.length === 0) {
      content.innerHTML = '<p class="lbMsg">Aucun score enregistré pour l\'instant.<br>Sois le premier !</p>';
      return;
    }
    const items = list.slice(0, 10).map((entry, i) => {
      const safeName = String(entry.name || '???').slice(0, 14);
      return '<li><span class="lbRank">#' + (i + 1) + '</span>' +
             '<span class="lbName">' + escapeHtml(safeName) + '</span>' +
             '<span class="lbScore">' + Math.floor(entry.score) + '</span></li>';
    }).join('');
    content.innerHTML = '<ul class="lbList">' + items + '</ul>';
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  async function openLeaderboard() {
    const modal = document.getElementById('leaderboardModal');
    const content = document.getElementById('lbContent');
    content.innerHTML = '<p class="lbMsg">Chargement...</p>';
    modal.classList.remove('hidden');
    const list = await fetchLeaderboard();
    renderLeaderboardList(list);
  }

  const CHAR_BOARD_COLOR = { guigui: '#ffd400' };
  function currentBoardColor() {
    return CHAR_BOARD_COLOR[selectedCharacter] || '#111';
  }
  function currentFlyingBoardColor() {
    return CHAR_BOARD_COLOR[selectedCharacter] || '#1a1a1a';
  }

  let best = 0;
  try { best = parseInt(localStorage.getItem('skate_best') || '0', 10) || 0; } catch(e) { best = 0; }
  bestEl.textContent = "BEST " + best;

  let state = 'ready'; // ready | running | over
  let score = 0;
  // vitesses réduites par rapport au format horizontal : la largeur de jeu
  // est plus étroite en portrait, donc moins de temps de réaction à vitesse égale
  let speed = 2.1;
  let baseSpeed = 1.7;
  let maxSpeed = 4.3;
  // accélération VRAIMENT très douce, par petit palier tous les 100 points de score
  let speedStep = 0.045;    // vitesse gagnée à chaque palier de 100 points
  let speedStepScore = 100; // taille du palier
  let gravity = 0.5;
  let frame = 0;
  let groundOffset = 0;
  // compteurs de défilement du décor, accumulés en continu (jamais recalculés
  // depuis frame*vitesse, ce qui évite tout saut visuel quand la vitesse change)
  // les silhouettes de décor sont de vrais objets qui défilent (voir landmarks plus bas),
  // jamais recalculées depuis la position écran : ça évite tout saut de forme.
  let landmarks = [];
  let landmarkCounter = 0;
  let bigRailThreshold = 0; // prochain seuil de score où le prochain rail sera le grand rail arc-en-ciel
  let flyingBoard = null; // planche qui s'échappe en rebondissant au moment du crash
  let oceanScrollX1 = 0;
  let oceanScrollX2 = 0;
  let oceanScrollX3 = 0;
  let wheelSpinAngle = 0;

  // ---- Terrain : alternance plat / montées / descentes ----
  // Le sol n'est plus une ligne plate : des collines s'enchaînent (plat -> montée
  // -> descente -> plat -> ...), et la vitesse augmente pendant les descentes
  // (et diminue légèrement dans les montées), pour un vrai ressenti de relief.
  let totalDistance = 0;    // distance totale parcourue dans le monde (jamais remise à 0 sauf reset)
  let terrainSegments = []; // segments consécutifs { start, end, elevStart, elevEnd, kind }
  let terrainGenUpTo = 0;   // distance monde jusqu'où le terrain est déjà généré
  const HILL_MAX_BOOST = 0.55; // vitesse maximale gagnée en pleine descente (+55%)
  const HILL_MAX_SLOW = 0.22;  // vitesse maximale perdue en pleine montée (-22%)

  function resetTerrain() {
    totalDistance = 0;
    terrainSegments = [{ start: 0, end: 420, elevStart: 0, elevEnd: 0, kind: 'flat' }];
    terrainGenUpTo = 420;
  }

  // Ajoute le prochain segment de terrain : après un plat vient toujours une
  // montée, après une montée toujours une descente qui revient au niveau de
  // base, puis à nouveau un plat — ça garantit l'alternance plat/courbes
  // demandée, sans jamais faire dériver le niveau du sol vers le haut ou le bas.
  function pushNextTerrainSegment() {
    const last = terrainSegments[terrainSegments.length - 1];
    let kind, length, elevEnd;
    if (last.kind === 'flat') {
      kind = 'up';
      length = 130 + Math.random() * 110;
      elevEnd = 45 + Math.random() * 55; // hauteur de la colline
    } else if (last.kind === 'up') {
      kind = 'down';
      length = 130 + Math.random() * 110;
      elevEnd = 0; // redescend toujours au niveau de base
    } else {
      kind = 'flat';
      length = 240 + Math.random() * 260;
      elevEnd = 0;
    }
    const seg = { start: last.end, end: last.end + length, elevStart: last.elevEnd, elevEnd, kind };
    terrainSegments.push(seg);
    terrainGenUpTo = seg.end;
  }

  function ensureTerrainAhead(uptoDistance) {
    while (terrainGenUpTo < uptoDistance) pushNextTerrainSegment();
    // purge les segments trop loin derrière pour ne pas accumuler indéfiniment
    while (terrainSegments.length > 2 && terrainSegments[1].end < totalDistance - 200) {
      terrainSegments.shift();
    }
  }

  // Hauteur du terrain (0 = niveau de base) à une distance monde donnée, avec
  // une interpolation en S (cosinus) : pente nulle à l'entrée et à la sortie
  // de chaque segment, donc des collines bien arrondies, jamais de cassure.
  function terrainInfoAt(worldX) {
    for (let i = 0; i < terrainSegments.length; i++) {
      const s = terrainSegments[i];
      if (worldX <= s.end || i === terrainSegments.length - 1) {
        const t = Math.max(0, Math.min(1, (worldX - s.start) / (s.end - s.start)));
        const eased = (1 - Math.cos(t * Math.PI)) / 2;
        const elev = s.elevStart + (s.elevEnd - s.elevStart) * eased;
        return { elev, kind: s.kind, t };
      }
    }
    return { elev: 0, kind: 'flat', t: 0 };
  }

  // Multiplicateur de vitesse selon le relief : pic au milieu de la pente,
  // nul en haut/bas de colline (raccord doux avec le plat).
  function terrainSpeedMultiplier(worldX) {
    const info = terrainInfoAt(worldX);
    const wave = Math.sin(info.t * Math.PI);
    if (info.kind === 'down') return 1 + HILL_MAX_BOOST * wave;
    if (info.kind === 'up') return 1 - HILL_MAX_SLOW * wave;
    return 1;
  }

  // Hauteur du sol (en coordonnées écran) à une position écran donnée
  function groundYAt(screenX) {
    const worldX = totalDistance + (screenX - player.x);
    return GROUND_Y - terrainInfoAt(worldX).elev;
  }

  // Joueur (skateur)
  const player = {
    x: 55,
    y: GROUND_Y,
    w: 40,
    h: 58,
    vy: 0,
    ducking: false,
    onGround: true,
    tilt: 0
  };
  const JUMP_V = -9.6;

  let obstacles = [];
  let coins = [];
  let particles = [];
  let floatingTexts = [];
  let nextSpawnIn = 60; // timer unique : garantit qu'un seul élément (obstacle OU pièces) apparaît à la fois, jamais superposés

  // ---- Grind / tricks / combo ----
  let grinding = null;      // référence à l'obstacle rail en cours de grind
  let combo = 1;
  let comboTimer = 0;
  let canTrick = true;      // un seul trick par saut
  let trick = null;         // { kind, elapsed, duration } - figure en cours d'animation
  let trickCycleIndex = 0;  // pour alterner entre les figures à chaque fois
  const TRICK_KINDS = ['kickflip', 'shuvit', 'threesixty'];
  let landTimer = 0;        // pour l'effet d'ecrasement a l'atterrissage
  let milestoneNextThreshold = 5000; // prochain palier de score où afficher le bandeau STOKED

  // ---- Décors qui changent selon le score : Largenté -> Santa Monica -> Malibu -> Largenté... ----
  const themes = [
    { key: 'largente',    name: 'LARGENTÉ',      sky: ['#12283a', '#e8935a'], silhouette: '#0a1c28', sun: '#ffd8a8', accent: '#ff7a1a', draw: drawLargenteUnit },
    { key: 'santamonica', name: 'SANTA MONICA',  sky: ['#1a2f3f', '#3d6b6f'], silhouette: '#0d2024', sun: '#ffe9a8', accent: '#7fffd4', draw: drawSantaMonicaUnit },
    { key: 'malibu',      name: 'MALIBU',        sky: ['#241a35', '#4a2f55'], silhouette: '#160f22', sun: '#ffb3d9', accent: '#b400ff', draw: drawMalibuUnit }
  ];
  function currentTheme() {
    const cyclePos = score % 20000;       // cycle complet de 20 000 points
    if (cyclePos < 5000) return themes[0];  // Largenté : 0 -> 5000
    if (cyclePos < 10000) return themes[1]; // Santa Monica : 5000 -> 10000
    return themes[2];                       // Malibu : 10000 -> 20000
  }

  // Vagues et surfeurs au loin, en arriere-plan du decor Largenté
  function drawLargenteOceanLayer(theme) {
    const waveY = GROUND_Y - 70;

    // bande d'ocean sombre derriere les vagues, pour donner de la profondeur
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(0, waveY - 10, W, 90);

    // ligne de vagues lointaine, douce et large
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.5;
    const waveOffset = oceanScrollX1;
    for (let x = waveOffset; x < W + 60; x += 60) {
      ctx.beginPath();
      ctx.moveTo(x, waveY - 6);
      ctx.quadraticCurveTo(x + 15, waveY - 12, x + 30, waveY - 6);
      ctx.quadraticCurveTo(x + 45, waveY, x + 60, waveY - 6);
      ctx.stroke();
    }

    // vagues intermediaires, un peu plus marquees
    ctx.strokeStyle = 'rgba(255,255,255,0.32)';
    ctx.lineWidth = 2;
    const waveOffset2 = oceanScrollX2;
    for (let x = waveOffset2; x < W + 46; x += 46) {
      ctx.beginPath();
      ctx.moveTo(x, waveY + 10);
      ctx.quadraticCurveTo(x + 11, waveY + 3, x + 23, waveY + 10);
      ctx.quadraticCurveTo(x + 35, waveY + 17, x + 46, waveY + 10);
      ctx.stroke();
    }

    // vagues proches, avec petite crete d'ecume qui deferle
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    const waveOffset3 = oceanScrollX3;
    for (let x = waveOffset3; x < W + 38; x += 38) {
      ctx.beginPath();
      ctx.moveTo(x, waveY + 26);
      ctx.quadraticCurveTo(x + 9, waveY + 20, x + 19, waveY + 26);
      ctx.quadraticCurveTo(x + 29, waveY + 32, x + 38, waveY + 26);
      ctx.stroke();
      // petits points d'ecume
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.arc(x + 19, waveY + 25, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Palmier stylisé (tronc courbé + palmes), réutilisé dans les trois décors
  function drawPalmTree(x, groundY, color, trunkH, frondR) {
    trunkH = trunkH || 46;
    frondR = frondR || 16;
    ctx.save();
    ctx.translate(x, groundY);
    ctx.fillStyle = color;

    // tronc légèrement courbé
    ctx.beginPath();
    ctx.moveTo(-2, 0);
    ctx.quadraticCurveTo(-5, -trunkH * 0.55, 2, -trunkH);
    ctx.quadraticCurveTo(6, -trunkH * 0.55, 3, 0);
    ctx.closePath();
    ctx.fill();

    // bouquet de palmes en éventail au sommet
    ctx.translate(2, -trunkH);
    for (let i = 0; i < 5; i++) {
      const angle = -Math.PI / 2 + (i - 2) * 0.42;
      ctx.save();
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(frondR * 0.5, -frondR * 0.25, frondR, 0);
      ctx.quadraticCurveTo(frondR * 0.5, frondR * 0.18, 0, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // Arbre stylisé inspiré du logo Largenté (couronne arrondie et feuillue,
  // en plusieurs lobes qui se chevauchent, tronc court, ombre au sol)
  function drawLogoTree(cx, groundY, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.ellipse(cx, groundY - 1, 13, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillRect(cx - 2, groundY - 14, 4, 14);
    ctx.beginPath();
    ctx.arc(cx, groundY - 26, 13, 0, Math.PI * 2);
    ctx.arc(cx - 9, groundY - 20, 9, 0, Math.PI * 2);
    ctx.arc(cx + 9, groundY - 20, 9, 0, Math.PI * 2);
    ctx.arc(cx - 5, groundY - 33, 8, 0, Math.PI * 2);
    ctx.arc(cx + 6, groundY - 34, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawLargenteUnit(x, idx, color, accent) {
    ctx.fillStyle = color;
    const m = idx % 3;
    if (m === 0) {
      // l'arbre du logo Largenté
      drawLogoTree(x + 20, GROUND_Y, color);
    } else if (m === 1) {
      // façade Largenté : aile latérale, corps principal à volets, toit à
      // deux pans, et portail à grille planté à droite du bâtiment
      const baseX = x, w = 40, bodyH = 30;
      const topY = GROUND_Y - 10 - bodyH;
      ctx.fillRect(baseX - 14, GROUND_Y - 18, 14, 18);
      ctx.fillRect(baseX, GROUND_Y - bodyH, w, bodyH);
      ctx.beginPath();
      ctx.moveTo(baseX - 4, GROUND_Y - bodyH);
      ctx.lineTo(baseX + w / 2, topY);
      ctx.lineTo(baseX + w + 4, GROUND_Y - bodyH);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = accent;
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          ctx.fillRect(baseX + 5 + col * 11, GROUND_Y - bodyH + 6 + row * 8, 5, 5);
        }
      }
      ctx.fillStyle = color;
      const poleX = baseX + w + 10;
      ctx.fillRect(poleX, GROUND_Y - 16, 4, 16);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let gx = 0; gx < 5; gx++) {
        ctx.moveTo(poleX + 6 + gx * 3, GROUND_Y - 10);
        ctx.lineTo(poleX + 6 + gx * 3, GROUND_Y);
      }
      ctx.stroke();
    } else {
      // vague stylisee du bord de mer
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y);
      ctx.quadraticCurveTo(x + 20, GROUND_Y - 14, x + 40, GROUND_Y);
      ctx.lineTo(x + 40, GROUND_Y + 20);
      ctx.lineTo(x, GROUND_Y + 20);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Grande roue de la jetée, palmiers et planches de surf de Santa Monica
  function drawSantaMonicaUnit(x, idx, color) {
    ctx.fillStyle = color;
    const m = idx % 3;
    if (m === 0) {
      // grande roue (jetée de Santa Monica), en silhouette
      const cx = x + 24, cy = GROUND_Y - 30, r = 24;
      ctx.fillRect(cx - 2, cy + r - 4, 4, 34); // pied
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 8; i++) {
        const a = (Math.PI * 2 * i) / 8;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        ctx.stroke();
      }
    } else if (m === 1) {
      // duo de palmiers
      drawPalmTree(x + 8, GROUND_Y, color, 30, 11);
      drawPalmTree(x + 34, GROUND_Y, color, 42, 14);
    } else {
      // planche de surf plantée dans le sable
      ctx.beginPath();
      ctx.ellipse(x + 20, GROUND_Y - 22, 6, 22, 0.15, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Villas en bord de falaise, arche de jetée, palmier et planches de Malibu
  function drawMalibuUnit(x, idx, color, accent) {
    ctx.fillStyle = color;
    const m = idx % 4;
    if (m === 0) {
      // villas de bord de mer, toits pointus jumeaux
      for (const dx of [0, 20]) {
        ctx.beginPath();
        ctx.moveTo(x + dx, GROUND_Y);
        ctx.lineTo(x + dx + 5, GROUND_Y - 50);
        ctx.lineTo(x + dx + 10, GROUND_Y);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillRect(x - 4, GROUND_Y - 18, 38, 18);
    } else if (m === 1) {
      // arche de la jetée de Malibu
      ctx.beginPath();
      ctx.arc(x + 20, GROUND_Y, 20, Math.PI, 0);
      ctx.fill();
    } else if (m === 2) {
      // grand palmier isolé
      drawPalmTree(x + 17, GROUND_Y, color, 46, 16);
    } else {
      // planches de surf posées l'une contre l'autre
      ctx.save();
      ctx.translate(x + 20, GROUND_Y - 9);
      ctx.rotate(-0.35);
      ctx.beginPath();
      ctx.ellipse(0, 0, 16, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-14, 0);
      ctx.lineTo(14, 0);
      ctx.stroke();
      for (const dx of [-6, 0, 6]) {
        ctx.beginPath();
        ctx.moveTo(dx, -2.4);
        ctx.lineTo(dx, 2.4);
        ctx.stroke();
      }
      ctx.restore();

      // une deuxieme planche, plus petite, un peu plus loin
      ctx.save();
      ctx.translate(x + 40, GROUND_Y - 6);
      ctx.rotate(0.25);
      ctx.beginPath();
      ctx.ellipse(0, 0, 11, 5.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-9.5, 0);
      ctx.lineTo(9.5, 0);
      ctx.stroke();
      for (const dx of [-4, 0, 4]) {
        ctx.beginPath();
        ctx.moveTo(dx, -1.8);
        ctx.lineTo(dx, 1.8);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function addFloatingText(txt, x, y, color) {
    floatingTexts.push({ txt, x, y, life: 45, color: color || '#ffd400' });
  }

  function bumpCombo() {
    combo++;
    comboTimer = 130;
    comboEl.textContent = "COMBO x" + combo;
    comboEl.classList.add('show');
  }

  function resetGame() {
    score = 0;
    speed = baseSpeed;
    frame = 0;
    obstacles = [];
    coins = [];
    particles = [];
    floatingTexts = [];
    nextSpawnIn = 150; // laisse le temps de bien démarrer avant le premier obstacle
    player.y = GROUND_Y;
    player.vy = 0;
    player.ducking = false;
    player.onGround = true;
    player.tilt = 0;
    grinding = null;
    combo = 1;
    comboTimer = 0;
    canTrick = true;
    trick = null;
    trickCycleIndex = 0;
    comboEl.classList.remove('show');
    landTimer = 0;
    milestoneNextThreshold = 5000;
    milestoneBanner.classList.remove('show');
    groundOffset = 0;
    oceanScrollX1 = 0;
    oceanScrollX2 = 0;
    oceanScrollX3 = 0;
    wheelSpinAngle = 0;
    bigRailThreshold = 0;
    flyingBoard = null;
    resetTerrain();
    ensureTerrainAhead(W + 150);
    player.y = groundYAt(player.x);

    // décor : vrais objets qui défilent, réinitialisés et pré-remplis à l'écran
    landmarks = [];
    landmarkCounter = 0;
    for (let x = 0; x <= W + 90; x += 90) {
      landmarks.push({ x, theme: currentTheme(), idx: landmarkCounter });
      landmarkCounter++;
    }
  }

  function jump() {
    if (state === 'ready') { startGame(); return; }
    if (state === 'over') { startGame(); return; }
    if (grinding) {
      // saut depuis un grind = petit bonus de sortie
      score += 15;
      addFloatingText('+15 OUT!', player.x, player.y - player.h - 10, '#7fffd4');
      Audio2.stopGrindSfx();
      grinding = null;
      player.vy = JUMP_V * 0.85;
      player.onGround = false;
      canTrick = true;
      Audio2.jumpSfx();
      return;
    }
    if (player.onGround && !player.ducking) {
      player.vy = JUMP_V;
      player.onGround = false;
      canTrick = true;
      Audio2.jumpSfx();
    }
  }

  function setDuck(on) {
    if (state !== 'running') return;
    player.ducking = on && player.onGround && !grinding;
  }

  function doTrick() {
    if (state !== 'running') return;
    if (player.onGround || grinding) return; // tricks uniquement en l'air
    if (!canTrick) return;
    canTrick = false;

    // les figures s'enchainent toujours dans un ordre different (jamais deux fois la meme de suite)
    const kind = TRICK_KINDS[trickCycleIndex % TRICK_KINDS.length];
    trickCycleIndex++;

    const rewards = { kickflip: 30, shuvit: 35, threesixty: 45 };
    const labels = { kickflip: 'FLIP !', shuvit: 'SHOVE-IT !', threesixty: '360° !' };
    const pts = rewards[kind] * combo;
    score += pts;
    bumpCombo();
    Audio2.trickSfx();

    trick = { kind, elapsed: 0, duration: kind === 'threesixty' ? 30 : 22 };
    addFloatingText('+' + pts + ' ' + labels[kind], player.x, player.y - player.h - 10, '#ffd400');
  }

  function startGame() {
    resetGame();
    state = 'running';
    overlay.classList.add('hidden');
    Audio2.resume();
    Audio2.startMusic();
  }

  function gameOver() {
    state = 'over';
    Audio2.stopGrindSfx();
    Audio2.stopMusic();
    Audio2.crashSfx();

    // la planche s'échappe sous les pieds et part rebondir plus loin
    flyingBoard = {
      x: player.x,
      y: player.y - 6,
      rot: 0,
      vx: -(speed + 3.5),
      vy: -7.5,
      spin: 0.4 + Math.random() * 0.2,
      bounces: 0,
      settled: false
    };

    if (score > best) {
      best = score;
      try { localStorage.setItem('skate_best', String(best)); } catch(e) {}
      bestEl.textContent = "BEST " + best;
    }
    const finalScore = score;
    overlay.innerHTML =
      '<div class="go">WIPEOUT !</div>' +
      '<p>Score : ' + finalScore + '</p>' +
      '<div id="scoreSaveArea">' +
        '<input id="pseudoField" type="text" maxlength="14" placeholder="Ton pseudo (optionnel)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" name="pseudoField_no_autofill">' +
        '<button id="btnSaveScore" type="button">Enregistrer mon score</button>' +
        '<div id="scoreSaveStatus"></div>' +
        '<button id="btnViewScoresOver" type="button" class="secondaryBtn">Voir les scores</button>' +
      '</div>' +
      '<p style="margin-top:10px;color:#ff7a1a;">Appuie ailleurs pour retenter</p>';
    overlay.classList.remove('hidden');

    // empêche de relancer la partie par erreur en tapant dans la zone de saisie
    const saveArea = document.getElementById('scoreSaveArea');
    ['pointerdown', 'touchstart', 'mousedown', 'click'].forEach((evt) => {
      saveArea.addEventListener(evt, (e) => e.stopPropagation());
    });
    // sécurité anti-autocomplétion : certains navigateurs pré-remplissent
    // quand même le champ malgré autocomplete="off", donc on le vide au cas où
    setTimeout(() => {
      const f = document.getElementById('pseudoField');
      if (f) f.value = '';
    }, 50);

    document.getElementById('btnViewScoresOver').addEventListener('click', (e) => {
      e.stopPropagation();
      openLeaderboard();
    });

    document.getElementById('btnSaveScore').addEventListener('click', async (e) => {
      e.stopPropagation();
      const btn = e.currentTarget;
      const statusEl = document.getElementById('scoreSaveStatus');
      const nameInput = document.getElementById('pseudoField');
      let name = (nameInput.value || '').trim().slice(0, 14);
      if (!name) name = 'Anonyme';
      btn.disabled = true;
      statusEl.textContent = 'Enregistrement...';
      const result = await submitScore(name, finalScore);
      if (result) {
        statusEl.textContent = 'Score enregistré !';
      } else {
        statusEl.textContent = "Échec de l'enregistrement, réessaie.";
        btn.disabled = false;
      }
    });
  }

  // Vrai si tout l'intervalle de terrain [worldStart, worldEnd] (+ marge de
  // sécurité) est plat : on n'y pose jamais de rail près d'une colline, pour
  // éviter les pieds à rallonge ou une accroche au grind juste avant une pente.
  function isFlatEnoughForRail(worldStart, worldEnd) {
    const margin = 50;
    const from = worldStart - margin;
    const to = worldEnd + margin;
    for (const s of terrainSegments) {
      if (s.end < from) continue;
      if (s.start > to) break;
      if (s.kind !== 'flat') return false;
    }
    return true;
  }

  // Position (en distance monde) où le prochain élément apparaît à l'écran
  function spawnPointWorldX() {
    return totalDistance + (W + 20 - player.x);
  }

  // ---- Obstacles : cônes et rails (à sauter ou grinder) ----
  function spawnObstacle() {
    // position (en distance monde) où l'obstacle apparaît, pour tester le relief à cet endroit
    const spawnWorldX = spawnPointWorldX();

    // le tout premier obstacle de la partie, puis un nouveau tous les 5000 points,
    // est ce grand rail arc-en-ciel (plus facile à négocier + retour ludique régulier)
    if (score >= bigRailThreshold) {
      bigRailThreshold += 5000;
      const w = 70 * 3, h = 14 * 2;
      // s'il n'y a pas assez de plat ici, on remplace par un cône : le prochain
      // grand rail sera retenté au palier de score suivant
      const type = isFlatEnoughForRail(spawnWorldX, spawnWorldX + w) ? 'rail' : 'cone';
      const ob = type === 'rail'
        ? { x: W + 20, type: 'rail', big: true, w, h }
        : { x: W + 20, type: 'cone', w: 22, h: 34 };
      ob.y = GROUND_Y - ob.h; ob.mode = 'jump';
      obstacles.push(ob);
      return ob.w;
    }

    // phase d'échauffement jusqu'à 2000 points : uniquement des petits cônes,
    // pas de rail (plus dur à négocier) — la difficulté normale reprend après
    const easyPhase = score < 2000;
    const types = easyPhase ? ['cone'] : ['cone', 'cone', 'rail'];
    let type = types[Math.floor(Math.random() * types.length)];
    // pas de rail près d'une colline (montée ou descente) : on bascule sur un cône
    if (type === 'rail' && !isFlatEnoughForRail(spawnWorldX, spawnWorldX + 70)) {
      type = 'cone';
    }
    let ob = { x: W + 20, type: type };

    if (type === 'cone') {
      if (easyPhase) {
        ob.w = 15; ob.h = 24;
      } else {
        ob.w = 22; ob.h = 34;
      }
      ob.y = GROUND_Y - ob.h; ob.mode = 'jump';
    } else if (type === 'rail') {
      ob.w = 70; ob.h = 14; ob.y = GROUND_Y - ob.h; ob.mode = 'jump';
    }
    obstacles.push(ob);
    return ob.w;
  }

  // ---- Pièces bonus (éclair jaune) : uniquement placées seules, jamais sur un obstacle ----
  function spawnCoinRow() {
    const offsets = [20, 60, 95]; // hauteur au-dessus du sol, suit le relief ensuite
    const offset = offsets[Math.floor(Math.random() * offsets.length)];
    const count = 3 + Math.floor(Math.random() * 3);
    const gap = 26;
    const startX = W + 20;
    for (let i = 0; i < count; i++) {
      const x = startX + i * gap;
      coins.push({ x, y: groundYAt(x) - offset, offset, r: 9, collected: false, spin: Math.random() * Math.PI * 2 });
    }
    return (count - 1) * gap + 18; // largeur totale occupée par la rangée
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update() {
    frame++;
    score += 1;
    speed = Math.min(maxSpeed, baseSpeed + Math.floor(score / speedStepScore) * speedStep);

    // relief : vitesse boostée en descente, un peu réduite en montée
    speed *= terrainSpeedMultiplier(totalDistance);
    totalDistance += speed;
    ensureTerrainAhead(totalDistance + W + 100);

    // bandeau "STOKED" en rose, à chaque palier de 5000 points (5000, 10000, 15000...)
    if (score >= milestoneNextThreshold) {
      milestoneNextThreshold += 5000;
      showMilestoneBanner('STOKED');
    }

    groundOffset -= speed;
    if (groundOffset < -40) groundOffset += 40;

    // défilement du décor lointain (vagues/surfeurs) : accumulation continue,
    // jamais recalculé depuis frame*vitesse (qui sautait quand la vitesse change)
    oceanScrollX1 -= speed * 0.05;
    if (oceanScrollX1 <= -60) oceanScrollX1 += 60;

    oceanScrollX2 -= speed * 0.08;
    if (oceanScrollX2 <= -46) oceanScrollX2 += 46;

    oceanScrollX3 -= speed * 0.11;
    if (oceanScrollX3 <= -38) oceanScrollX3 += 38;

    // silhouettes de décor (monuments) : vrais objets qui avancent et se
    // recyclent, chacun garde sa forme assignée à sa création -> jamais de saut
    for (let i = landmarks.length - 1; i >= 0; i--) {
      landmarks[i].x -= speed * 0.15;
      if (landmarks[i].x < -100) landmarks.splice(i, 1);
    }
    while (landmarks.length === 0 || landmarks[landmarks.length - 1].x < W + 90) {
      const newX = landmarks.length ? landmarks[landmarks.length - 1].x + 90 : W + 90;
      landmarks.push({ x: newX, theme: currentTheme(), idx: landmarkCounter });
      landmarkCounter++;
    }

    wheelSpinAngle += Math.max(speed, 0.5) * 0.22;

    // physique joueur
    const duckH = 34;
    const standH = 58;
    player.h = player.ducking ? duckH : standH;
    const groundHere = groundYAt(player.x); // suit le relief (plat/montée/descente)

    if (grinding) {
      // collé au rail, suit sa hauteur, avance avec le monde
      player.y = grinding.y;
      player.vy = 0;
      player.onGround = false;
      score += 2;
      if (frame % 4 === 0) {
        particles.push({ x: player.x, y: player.y - 2, life: 12, vy: -0.3 - Math.random() * 0.5, color: '#ffd400' });
      }
      // fin du grind quand le rail est passé sous le joueur
      if (grinding.x + grinding.w < player.x + 6 || obstacles.indexOf(grinding) === -1) {
        const bonus = 20 * combo;
        score += bonus;
        bumpCombo();
        addFloatingText('+' + bonus + ' GRIND!', player.x, player.y - player.h - 10, '#7fffd4');
        Audio2.stopGrindSfx();
        grinding = null;
        player.vy = -2;
        player.onGround = false;
      }
    } else if (!player.onGround) {
      player.vy += gravity;
      player.y += player.vy;
      if (player.y >= groundHere) {
        player.y = groundHere;
        player.vy = 0;
        player.onGround = true;
        canTrick = true;
        landTimer = 10;
      }
    } else {
      player.y = groundHere;
    }
    player.tilt = player.vy * 1.1;
    if (landTimer > 0) landTimer--;

    // progression de l'animation de la figure en cours
    if (trick) {
      trick.elapsed++;
      if (trick.elapsed >= trick.duration) trick = null;
    }

    // combo qui retombe si pas alimenté
    if (comboTimer > 0) {
      comboTimer--;
      if (comboTimer === 0) {
        combo = 1;
        comboEl.classList.remove('show');
      }
    }

    // spawn : un seul timer partagé entre obstacles et pièces, avec une marge
    // calculée pour que le prochain élément n'apparaisse jamais avant que
    // le précédent ait totalement dégagé la place (donc jamais superposés).
    nextSpawnIn--;
    if (nextSpawnIn <= 0) {
      // pas de plot (ni de rail) dans une montée : uniquement des pièces,
      // les obstacles n'apparaissent que sur le plat ou en descente
      const uphillHere = terrainInfoAt(spawnPointWorldX()).kind === 'up';
      const spawnCoinsThisTime = uphillHere || Math.random() < 0.38;
      const widthJustSpawned = spawnCoinsThisTime ? spawnCoinRow() : spawnObstacle();

      const safetyMarginPx = 55; // marge de sécurité en pixels entre deux éléments
      const framesToClear = (widthJustSpawned + safetyMarginPx) / Math.max(speed, 0.1);
      // un peu plus d'air entre les éléments pendant la phase d'échauffement (< 2000 pts)
      const extraGapFrames = (score < 2000 ? 45 : 25) + Math.random() * 55;
      nextSpawnIn = framesToClear + extraGapFrames;
    }

    // move obstacles + collisions
    // hitbox plus indulgente que le sprite affiché (marge augmentée) pour
    // éviter les collisions "injustes" au premier contact visuel
    const pHitbox = {
      x: player.x + 9,
      y: player.y - player.h + 12,
      w: player.w - 18,
      h: player.h - 14
    };

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const ob = obstacles[i];
      ob.x -= speed;
      if (ob.x + ob.w < -10) {
        if (grinding === ob) { Audio2.stopGrindSfx(); grinding = null; }
        obstacles.splice(i, 1);
        continue;
      }
      // hauteur calculée au centre de l'obstacle (pas au bord gauche) pour que
      // les rails larges restent bien centrés sur la pente, pieds compris
      ob.y = groundYAt(ob.x + ob.w / 2) - ob.h;

      const obBox = { x: ob.x, y: ob.y, w: ob.w, h: ob.h };

      // accroche au rail : si on tombe dessus par le dessus -> grind, sinon collision normale
      if (ob.mode === 'jump' && ob.type === 'rail' && !grinding) {
        const feetY = player.y;
        const fallingOntoTop = !player.onGround && player.vy >= 0 &&
          feetY >= ob.y - 10 && feetY <= ob.y + 16 &&
          player.x + player.w - 8 > ob.x && player.x + 8 < ob.x + ob.w;
        if (fallingOntoTop) {
          grinding = ob;
          Audio2.startGrindSfx();
          continue;
        }
      }

      if (!grinding && rectsOverlap(pHitbox, obBox)) {
        gameOver();
      }
    }

    // move pièces + collecte
    const coinHitbox = {
      x: player.x + 4,
      y: player.y - player.h,
      w: player.w - 8,
      h: player.h
    };
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.x -= speed;
      c.spin += 0.15;
      if (c.x < -20) { coins.splice(i, 1); continue; }
      c.y = groundYAt(c.x) - c.offset; // suit le relief pendant qu'elle défile
      const coinBox = { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
      if (rectsOverlap(coinHitbox, coinBox)) {
        coins.splice(i, 1);
        const gain = 10 * combo;
        score += gain;
        Audio2.coinSfx();
        addFloatingText('+' + gain, c.x, c.y - 12, '#ffd400');
        for (let k = 0; k < 8; k++) {
          const ang = Math.random() * Math.PI * 2;
          particles.push({
            x: c.x, y: c.y, life: 16,
            vy: Math.sin(ang) * 1.4,
            vx: Math.cos(ang) * 1.4,
            color: '#ffd400'
          });
        }
      }
    }

    // particules de vitesse (petites trainées)
    const theme = currentTheme();
    if (frame % 3 === 0 && !grinding) {
      particles.push({ x: player.x - 4, y: groundHere - 4, life: 14, vy: -0.5 - Math.random(), color: theme.accent });
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x -= speed * 1.3 - (p.vx || 0);
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // textes flottants (points de trick / grind)
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const t = floatingTexts[i];
      t.y -= 0.7;
      t.life--;
      if (t.life <= 0) floatingTexts.splice(i, 1);
    }
  }

  // ---- Rendu ----
  function hexToRgb(hex) {
    const v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  function drawBackground() {
    const theme = currentTheme();

    // ciel degrade selon le theme
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, theme.sky[0]);
    grad.addColorStop(1, theme.sky[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // soleil / lune selon le theme (position proportionnelle a la hauteur,
    // pour rester bien placee meme sur un tres grand ciel en portrait)
    ctx.fillStyle = theme.sun;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(W - 55, H * 0.10, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // vagues et surfeurs au loin, uniquement pour le decor Largenté
    if (theme.key === 'largente') {
      drawLargenteOceanLayer(theme);
    }

    // silhouettes du décor (monuments/paysages) : vrais objets, chacun garde sa forme
    // agrandies verticalement (ancrées au sol) pour mieux remplir la hauteur en portrait
    for (const lm of landmarks) {
      ctx.save();
      ctx.translate(0, GROUND_Y);
      ctx.scale(1, 1.45);
      ctx.translate(0, -GROUND_Y);
      lm.theme.draw(lm.x, lm.idx, lm.theme.silhouette, lm.theme.accent);
      ctx.restore();
    }

    // sol : suit le profil de terrain (plat / montées / descentes), échantillonné
    // par petits pas le long de l'écran pour dessiner une courbe bien arrondie
    const groundStep = 10;
    ctx.fillStyle = '#0d0616';
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, groundYAt(0));
    for (let gx = groundStep; gx <= W; gx += groundStep) {
      ctx.lineTo(gx, groundYAt(gx));
    }
    ctx.lineTo(W, groundYAt(W));
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = theme.accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundYAt(0));
    for (let gx = groundStep; gx <= W; gx += groundStep) {
      ctx.lineTo(gx, groundYAt(gx));
    }
    ctx.stroke();

    // pointilles de vitesse sur le sol, suivent aussi la courbe
    const [r, g, b] = hexToRgb(theme.accent);
    ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',0.35)';
    ctx.lineWidth = 2;
    ctx.setLineDash([16, 14]);
    ctx.lineDashOffset = -groundOffset;
    ctx.beginPath();
    ctx.moveTo(0, groundYAt(0) + 14);
    for (let gx = groundStep; gx <= W; gx += groundStep) {
      ctx.lineTo(gx, groundYAt(gx) + 14);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;

    // etiquette du decor en cours (petit repere discret)
    ctx.font = '10px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText(theme.name, 16, H - 10);
  }

  function drawParticles() {
    for (const p of particles) {
      const color = p.color || '#ff7a1a';
      const [r, g, b] = hexToRgb(color.length === 7 ? color : '#ff7a1a');
      ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + Math.max(0, p.life / 14) + ')';
      ctx.fillRect(p.x, p.y, 4, 4);
    }
  }

  function drawFloatingTexts() {
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    for (const t of floatingTexts) {
      ctx.globalAlpha = Math.max(0, t.life / 45);
      ctx.fillStyle = t.color;
      ctx.fillText(t.txt, t.x + player.w / 2, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  function drawObstacles() {
    for (const ob of obstacles) {
      if (ob.type === 'cone') {
        ctx.fillStyle = '#ff7a1a';
        ctx.beginPath();
        ctx.moveTo(ob.x + ob.w / 2, ob.y);
        ctx.lineTo(ob.x + ob.w - 2, ob.y + ob.h);
        ctx.lineTo(ob.x + 2, ob.y + ob.h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(ob.x + 3, ob.y + ob.h * 0.55, ob.w - 6, 4);
      } else if (ob.type === 'rail') {
        const active = grinding === ob;
        let railColor = active ? '#ffd400' : '#7fffd4';
        let edgeColor = active ? '#c79a00' : '#4fd6b0';

        // le grand rail du tout début change de toutes les couleurs pendant le grind
        if (ob.big && active) {
          const hue = (frame * 4) % 360;
          railColor = 'hsl(' + hue + ', 95%, 58%)';
          edgeColor = 'hsl(' + ((hue + 40) % 360) + ', 95%, 40%)';
        }

        ctx.fillStyle = railColor;
        if (active) {
          ctx.shadowColor = railColor;
          ctx.shadowBlur = 12;
        }
        // barre de roulement, au sommet exact du rail (là où les pieds atterrissent)
        ctx.fillRect(ob.x, ob.y, ob.w, 4);
        ctx.shadowBlur = 0;
        ctx.fillStyle = edgeColor;
        // pieds/supports qui descendent jusqu'au sol réel de chaque côté (et non
        // une longueur fixe), pour ne jamais laisser de vide en pente
        const legTopY = ob.y + 4;
        const leftLegLen = Math.max(2, groundYAt(ob.x + 2) - legTopY);
        const rightLegLen = Math.max(2, groundYAt(ob.x + ob.w - 2) - legTopY);
        ctx.fillRect(ob.x, legTopY, 4, leftLegLen);
        ctx.fillRect(ob.x + ob.w - 4, legTopY, 4, rightLegLen);
      }
    }
  }

  function drawCoins() {
    for (const c of coins) {
      const bob = Math.sin(c.spin * 0.6) * 2;
      const cy = c.y + bob;

      // halo lumineux
      ctx.save();
      ctx.shadowColor = '#ffd400';
      ctx.shadowBlur = 10;

      // piece (cercle jaune degrade, effet de rotation via largeur)
      const squish = Math.abs(Math.cos(c.spin));
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.ellipse(c.x, cy, c.r * Math.max(0.35, squish), c.r, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#c79a00';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // eclair au centre
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#7a5200';
      ctx.beginPath();
      const rw = c.r * Math.max(0.35, squish) * 0.55;
      const rh = c.r * 0.7;
      ctx.moveTo(c.x + rw * 0.35, cy - rh);
      ctx.lineTo(c.x - rw * 0.25, cy + rh * 0.15);
      ctx.lineTo(c.x + rw * 0.05, cy + rh * 0.15);
      ctx.lineTo(c.x - rw * 0.35, cy + rh);
      ctx.lineTo(c.x + rw * 0.35, cy - rh * 0.05);
      ctx.lineTo(c.x + rw * 0.02, cy - rh * 0.05);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }
  }

  function drawPlayer() {
    ctx.save();
    const drawH = player.h + 10;
    const drawW = player.w;
    const px = player.x;
    const py = player.y - drawH;
    const grounded = player.onGround && !grinding;
    const airborne = !player.onGround && !grinding;

    let squashX = 1, squashY = 1, bobY = 0;

    if (airborne) {
      // etirement vertical proportionnel a la vitesse (monte etire, descend s'affine)
      const t = Math.min(Math.abs(player.vy) / 12, 1);
      squashY = 1 + t * 0.16;
      squashX = 1 - t * 0.10;
    } else if (landTimer > 0) {
      // ecrasement a l'atterrissage qui se resorbe
      const t = landTimer / 10;
      squashY = 1 - t * 0.24;
      squashX = 1 + t * 0.18;
    } else if (grounded && state === 'running') {
      // petit bobbing continu pour simuler la course/le roulement
      const bob = Math.sin(frame * 0.35);
      squashY = 1 + bob * 0.035;
      squashX = 1 - bob * 0.025;
      bobY = -Math.abs(bob) * 2;
    }

    // le 360 fait tourner le personnage ET la planche ensemble ; flip/shove-it ne touchent que la planche
    const trickProgress = trick ? trick.elapsed / trick.duration : 0;
    const bodySpin = (trick && trick.kind === 'threesixty') ? trickProgress * Math.PI * 2 : 0;

    if (airborne) {
      // pivot au centre pour les rotations aeriennes (tricks)
      ctx.translate(px + drawW / 2, py + drawH / 2);
      ctx.rotate((player.tilt || 0) * 0.01 + bodySpin);
      ctx.scale(squashX, squashY);
      ctx.translate(-drawW / 2, -drawH / 2);
    } else {
      // pivot aux pieds pour garder les appuis au sol pendant course/atterrissage/grind
      ctx.translate(px + drawW / 2, py + drawH + bobY);
      ctx.scale(squashX, squashY);
      ctx.translate(-drawW / 2, -drawH);
    }

    if (charImg.complete && charImg.naturalWidth > 0) {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(charImg, 0, 0, drawW, drawH);
    } else {
      ctx.fillStyle = '#ff7a1a';
      ctx.fillRect(0, 0, drawW, drawH);
    }

    // planche de skate sous les pieds, avec sa propre animation de figure
    // (masquée après un crash : elle s'est échappée, voir flyingBoard)
    if (state !== 'over') {
      let boardTransform = null;
      if (trick && trick.kind === 'kickflip') {
        // flip : la planche bascule sur elle-meme sous les pieds (rotation complete)
        boardTransform = { rotateFlip: trickProgress * Math.PI * 2 };
      } else if (trick && trick.kind === 'shuvit') {
        // pop shove-it : la planche pivote a plat sous les pieds, le corps ne bouge pas
        boardTransform = { rotateFlat: trickProgress * Math.PI * 2 };
      }
      drawSkateboardUnderFeet(drawW, drawH, boardTransform);
    }

    ctx.restore();
  }

  function drawSkateboardUnderFeet(drawW, drawH, transform) {
    ctx.save();
    const cx = drawW / 2;
    const cy = drawH - 6;
    if (transform && transform.rotateFlat) {
      // rotation a plat (vue du dessus simulee par un ecrasement horizontal qui va et vient)
      ctx.translate(cx, cy);
      ctx.rotate(transform.rotateFlat);
      ctx.translate(-cx, -cy);
    } else if (transform && transform.rotateFlip) {
      // flip : la planche s'aplatit puis se retourne (rotation autour de son axe long)
      ctx.translate(cx, cy);
      ctx.scale(1, Math.cos(transform.rotateFlip));
      ctx.translate(-cx, -cy);
    }

    const deckW = drawW + 16;
    const deckX = -8;
    const deckY = drawH - 7;
    const deckH = 5;
    const wheelR = 3;
    const wheelY = deckY + deckH + wheelR - 1;
    const wheelXs = [deckX + 7, deckX + deckW - 7];

    // roues qui tournent (donne l'impression de rouler)
    const spin = wheelSpinAngle;
    for (const wx of wheelXs) {
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.arc(wx, wheelY, wheelR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffd400';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(wx + Math.cos(spin) * (wheelR - 0.5), wheelY + Math.sin(spin) * (wheelR - 0.5));
      ctx.lineTo(wx - Math.cos(spin) * (wheelR - 0.5), wheelY - Math.sin(spin) * (wheelR - 0.5));
      ctx.stroke();
    }

    // trucks (attaches metal entre les roues et la planche)
    ctx.fillStyle = '#9aa0a6';
    for (const wx of wheelXs) {
      ctx.fillRect(wx - 4, deckY + deckH - 1, 8, 2);
    }

    // planche (deck) avec kicktail avant/arriere legerement relevé
    ctx.fillStyle = currentBoardColor();
    ctx.beginPath();
    ctx.moveTo(deckX + 3, deckY + deckH);
    ctx.lineTo(deckX, deckY + 1);
    ctx.lineTo(deckX + 4, deckY - 2);
    ctx.lineTo(deckX + deckW - 4, deckY - 2);
    ctx.lineTo(deckX + deckW, deckY + 1);
    ctx.lineTo(deckX + deckW - 3, deckY + deckH);
    ctx.closePath();
    ctx.fill();

    // grip tape sur le dessus
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(deckX + 4, deckY - 2, deckW - 8, 2);

    // liseré de couleur sur la tranche de la planche
    ctx.fillStyle = '#ff7a1a';
    ctx.fillRect(deckX + 3, deckY + deckH - 1, deckW - 6, 1);

    ctx.restore();
  }

  // ---- Planche qui s'échappe en rebondissant après un crash ----
  function updateFlyingBoard() {
    if (!flyingBoard || flyingBoard.settled) return;
    const b = flyingBoard;
    b.vy += gravity;
    b.x += b.vx;
    b.y += b.vy;
    b.rot += b.spin;

    const boardGroundY = groundYAt(b.x);
    if (b.y >= boardGroundY) {
      b.y = boardGroundY;
      b.vy *= -0.45;
      b.vx *= 0.7;
      b.spin *= 0.55;
      b.bounces++;
      if (b.bounces >= 3 || Math.abs(b.vy) < 0.7) {
        b.vy = 0; b.vx = 0; b.spin = 0; b.settled = true;
      }
    }
  }

  function drawFlyingBoard() {
    if (!flyingBoard) return;
    const b = flyingBoard;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);

    // planche simplifiee (deck + roues), reutilise le style du jeu
    const deckW = 40, deckH = 5;
    const wheelR = 3;
    ctx.fillStyle = currentFlyingBoardColor();
    ctx.beginPath();
    ctx.moveTo(-deckW / 2 + 3, deckH);
    ctx.lineTo(-deckW / 2, -1);
    ctx.lineTo(-deckW / 2 + 4, -3);
    ctx.lineTo(deckW / 2 - 4, -3);
    ctx.lineTo(deckW / 2, -1);
    ctx.lineTo(deckW / 2 - 3, deckH);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff7a1a';
    ctx.fillRect(-deckW / 2 + 4, -1, deckW - 8, 2);

    ctx.fillStyle = '#1a1a1a';
    for (const wx of [-deckW / 2 + 6, deckW / 2 - 6]) {
      ctx.beginPath();
      ctx.arc(wx, deckH + wheelR - 1, wheelR, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawHudTexts() {
    hud.textContent = "SCORE " + score;
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawParticles();
    drawCoins();
    drawObstacles();
    drawPlayer();
    drawFlyingBoard();
    drawFloatingTexts();

    if (state === 'running') {
      update();
      drawHudTexts();
    } else if (state === 'over') {
      updateFlyingBoard();
    }

    requestAnimationFrame(loop);
  }

  // ---- Controles ----
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      jump();
    } else if (e.code === 'ArrowDown') {
      e.preventDefault();
      setDuck(true);
    } else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
      e.preventDefault();
      doTrick();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown') setDuck(false);
  });

  // Tricks tactiles : vraie détection de double-tap au doigt (dblclick ne
  // se déclenche pas de façon fiable sur mobile), basée sur le délai entre 2 appuis
  let lastTapTime = 0;
  const DOUBLE_TAP_MS = 320;

  canvas.addEventListener('dblclick', () => {
    doTrick();
  });

  let touchDuckTimer = null;
  function handleTapStart(e) {
    if (e.cancelable) e.preventDefault();
    const now = Date.now();
    const isDoubleTap = (now - lastTapTime) < DOUBLE_TAP_MS;
    lastTapTime = now;

    if (isDoubleTap && state === 'running' && !player.onGround && !grinding) {
      // 2e appui rapide en l'air = figure
      doTrick();
    } else {
      jump();
      touchDuckTimer = setTimeout(() => setDuck(true), 220);
    }
  }
  function handleTapEnd() {
    if (touchDuckTimer) clearTimeout(touchDuckTimer);
    setDuck(false);
  }

  // Pointer Events en priorité (couvre souris + tactile sur la plupart des
  // navigateurs) ; sinon on retombe sur touchstart/touchend, utile pour un
  // navigateur intégré (Instagram, TikTok...) qui les gérerait mal.
  // (on ne branche JAMAIS les deux à la fois, sinon un seul tap se compterait deux fois)
  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', handleTapStart);
    canvas.addEventListener('pointerup', handleTapEnd);
    overlay.addEventListener('pointerdown', (e) => {
      if (e.cancelable) e.preventDefault();
      jump();
    });
  } else {
    canvas.addEventListener('touchstart', handleTapStart, { passive: false });
    canvas.addEventListener('touchend', handleTapEnd);
    canvas.addEventListener('mousedown', handleTapStart);
    canvas.addEventListener('mouseup', handleTapEnd);
    overlay.addEventListener('touchstart', (e) => {
      if (e.cancelable) e.preventDefault();
      jump();
    }, { passive: false });
    overlay.addEventListener('mousedown', (e) => {
      if (e.cancelable) e.preventDefault();
      jump();
    });
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
