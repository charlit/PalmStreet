services:
  palmstreet:
    build: .
    container_name: palmstreet
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8082
      # change cette valeur pour ton vrai mot de passe avant de lancer
      - VISITS_KEY=change-moi-avant-de-publier
